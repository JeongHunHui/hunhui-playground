<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Snake 🐍 | 훈희 플레이그라운드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      touch-action: none;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: #aaa; }
    .score-board {
      display: flex;
      gap: 40px;
      margin: 12px 0 20px;
      font-size: 1rem;
      color: #888;
    }
    .score-board b { color: #f0f0f0; }
    #canvas {
      border: 2px solid #222;
      border-radius: 12px;
      background: #111;
      display: block;
      box-shadow: 0 0 40px rgba(74,222,128,0.1);
    }
    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }
    .overlay h2 { font-size: 2rem; font-weight: 800; }
    .overlay p { color: #888; font-size: 0.95rem; }
    .btn {
      margin-top: 8px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #4ade80, #22d3ee);
      color: #0a0a0a;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; transform: scale(1.03); }
    .btn:active { transform: scale(0.97); }
    #wrapper { position: relative; display: flex; align-items: center; justify-content: center; }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 6px;
      margin-top: 20px;
    }
    .dpad-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #f0f0f0;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .dpad-btn:active { background: #333; }
    .hint { color: #444; font-size: 0.8rem; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <a class="back-link" href="/">← 플레이그라운드</a>
  <h1>🐍 Snake</h1>
  <div class="score-board">
    점수: <b id="score">0</b> &nbsp; 최고: <b id="best">0</b>
  </div>
  <div id="wrapper">
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
      <h2>🐍 Snake</h2>
      <p>방향키 / WASD 로 뱀을 조종하세요</p>
      <button class="btn" id="startBtn">시작하기</button>
    </div>
  </div>
  <div class="dpad">
    <div></div>
    <div class="dpad-btn" data-dir="UP">▲</div>
    <div></div>
    <div class="dpad-btn" data-dir="LEFT">◀</div>
    <div></div>
    <div class="dpad-btn" data-dir="RIGHT">▶</div>
    <div></div>
    <div class="dpad-btn" data-dir="DOWN">▼</div>
    <div></div>
  </div>
  <p class="hint">PC: 방향키 / WASD · 스페이스바 재시작 | 모바일: 스와이프 or 방향패드</p>

<script>
const COLS=20,ROWS=20,CELL=24;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
canvas.width=COLS*CELL;canvas.height=ROWS*CELL;
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
let snake,dir,nextDir,food,score,best,running,loop;
best=parseInt(localStorage.getItem('snakeBest')||'0');
bestEl.textContent=best;

function rnd(){return{x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
function spawnFood(){let p;do{p=rnd();}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p;}
function init(){
  const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;scoreEl.textContent=0;spawnFood();
}
function draw(){
  ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);
  // 격자
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,ROWS*CELL);ctx.stroke();}
  for(let j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(COLS*CELL,j*CELL);ctx.stroke();}
  // food
  const pulse=0.85+0.15*Math.sin(Date.now()/200);
  ctx.save();
  ctx.translate(food.x*CELL+CELL/2,food.y*CELL+CELL/2);
  ctx.scale(pulse,pulse);
  ctx.fillStyle='#f87171';
  ctx.beginPath();ctx.arc(0,0,CELL/2-3,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // snake
  snake.forEach((s,i)=>{
    const grad=ctx.createLinearGradient(s.x*CELL,s.y*CELL,(s.x+1)*CELL,(s.y+1)*CELL);
    grad.addColorStop(0,i===0?'#4ade80':'#22c55e');
    grad.addColorStop(1,i===0?'#22d3ee':'#16a34a');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4,5);ctx.fill();
  });
}
function step(){
  dir=nextDir;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){gameOver();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snakeBest',best);}
    spawnFood();
  }else{snake.pop();}
  draw();
}
let animFrame;
function gameLoop(){
  if(!running)return;
  step();
  animFrame=setTimeout(()=>requestAnimationFrame(gameLoop),Math.max(80,180-score*4));
}
function start(){
  init();overlay.style.display='none';running=true;
  cancelAnimationFrame(animFrame);clearTimeout(animFrame);
  draw();gameLoop();
}
function gameOver(){
  running=false;clearTimeout(animFrame);
  overlay.innerHTML=`<h2 style="color:#f87171">Game Over 💀</h2><p>점수: <strong>${score}</strong> | 최고: <strong>${best}</strong></p><button class="btn" onclick="start()">다시 시작</button>`;
  overlay.style.display='flex';
}
document.getElementById('startBtn').addEventListener('click',start);
document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
    w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
    W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
  if(e.key===' '&&!running){start();return;}
  const nd=m[e.key];
  if(nd&&!(nd.x===-dir.x&&nd.y===-dir.y)){e.preventDefault();nextDir=nd;}
});
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const dm={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
  btn.addEventListener('click',()=>{
    if(!running)return;
    const d=dm[btn.dataset.dir];
    if(d&&!(d.x===-dir.x&&d.y===-dir.y))nextDir=d;
  });
});
let ts=null;
canvas.addEventListener('touchstart',e=>{ts=e.touches[0];},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!ts||!running)return;
  const dx=e.changedTouches[0].clientX-ts.clientX,dy=e.changedTouches[0].clientY-ts.clientY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  let d=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(!(d.x===-dir.x&&d.y===-dir.y))nextDir=d;ts=null;
},{passive:true});
// 애니메이션 루프 (먹이 펄스용)
function animDraw(){requestAnimationFrame(animDraw);if(running)draw();}
animDraw();
draw();
</script>
</body>
</html>
